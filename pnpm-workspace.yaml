packages:
    - apps/*
    - packages/*

blockExoticSubdeps: true

catalog:
    "@simplewebauthn/server": ^14.0.3
    "@types/node": ^26.6.5
    kysely: ^0.29.7
    msgpackr: ^2.1.2
    tsx: 4.23.15
    typescript: 7.0.2
    uuid: ^14.0.3
    vitest: 5.0.5
    zod: ^4.6.7

catalogMode: strict

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
    - "@vex-chat/cli"
    - "@vex-chat/crypto"
    - "@vex-chat/libvex"
    - "@vex-chat/spire"
    - "@vex-chat/types"

onlyBuiltDependencies:
    - argon2
    - better-sqlite3
    - esbuild
    - msgpackr-extract
